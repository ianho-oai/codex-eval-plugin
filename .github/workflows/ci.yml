name: Lightweight validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: ./eval self-check
      - run: node --check plugins/codex-eval-plugin/ceval/data/web/app.js
      - run: ./eval export --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: codex-eval-plugin
          path: dist/
