<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workflow evaluation · Codex Eval</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><a class="brand" href="/">Codex Eval</a><a class="export" href="/results.csv">Export CSV ↗</a></header>
<main>
  <h1>Workflow evaluation</h1>
  <div id="banner" class="banner" role="status" hidden></div>
  <section class="panel" aria-label="Workflow evaluation chart">
    <div class="controls">
      <label>Task<select id="task"><option value="">All tasks</option></select></label>
      <label>Provider<select id="provider"><option value="">Both providers</option><option value="codex">Codex</option><option value="claude">Claude Code</option></select></label>
      <label>Difficulty<select id="difficulty"><option value="">All difficulties</option><option>easy</option><option>medium</option><option>hard</option></select></label>
      <label>Outcome<select id="outcome"><option value="">All attempts</option><option value="pass">Pass</option><option value="fail">Fail</option><option value="invalid">Infrastructure invalid</option></select></label>
      <label>X-axis<select id="x"></select></label>
      <label>Y-axis<select id="y"></select></label>
    </div>
    <div class="legend"><span class="codex-key">● <span>Codex</span></span><span class="claude-key">● <span>Claude Code</span></span></div>
    <div class="plot-wrap"><svg id="plot" viewBox="0 0 1200 560" role="group" aria-label="Evaluation attempts. Focus a point to inspect its details."></svg><div id="tooltip" class="tooltip" role="tooltip" hidden></div></div>
  </section>
</main>
<script src="/app.js"></script>
</body></html>
